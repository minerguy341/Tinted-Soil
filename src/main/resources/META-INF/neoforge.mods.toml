modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/minerguy341/Tinted-Soil/issues"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "minerguy341"
description = '''
Retints vanilla and worldgen-mod soil in place -- dirt, coarse dirt, podzol and grass blocks --
so soil blends smoothly across biome and soil borders instead of cutting off hard. Adds no
blocks and changes no world data.
'''

[[mixins]]
config = "tintedsoil.mixins.json"

[[mixins]]
config = "tintedsoil.client.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
